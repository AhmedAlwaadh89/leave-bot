{% extends 'portal/base.html' %}
{% block title %}تغيير كلمة المرور{% endblock %}
{% block content %}
<div class="card p-4">
    <h5 class="mb-3">🔑 تغيير كلمة المرور</h5>
    <form method="POST">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
            <label class="form-label">كلمة المرور الحالية</label>
            <input type="password" name="current_password" class="form-control" autocomplete="current-password" required dir="ltr">
        </div>
        <div class="mb-3">
            <label class="form-label">كلمة المرور الجديدة</label>
            <input type="password" name="new_password" class="form-control" autocomplete="new-password" minlength="6" required dir="ltr">
        </div>
        <div class="mb-4">
            <label class="form-label">تأكيد كلمة المرور الجديدة</label>
            <input type="password" name="new_password2" class="form-control" autocomplete="new-password" minlength="6" required dir="ltr">
        </div>
        <button type="submit" class="btn btn-brand w-100 py-2">حفظ</button>
    </form>
    <p class="small-muted mt-3 mb-0">بعد التغيير يُسجَّل خروجك من الأجهزة الأخرى.</p>
</div>
{% endblock %}
